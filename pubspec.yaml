name: flutter_template
description: "Flutter template."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ui tools
  cupertino_icons: ^1.0.8
  reactive_forms: ^18.2.2
  flutter_svg: ^2.3.0
  blur: ^4.0.2

  # intl
  intl: ^0.20.2
  intl_utils: ^2.8.14

  # api
  retrofit: ^4.9.2
  dio: ^5.11.0

  # annotations
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # utils
  freezed: ^3.2.5
  package_info_plus: ^10.2.1
  equatable: ^2.1.0

  # storage
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  shared_preferences_android: ^2.4.27
  shared_preferences_foundation: ^2.5.6
  flutter_secure_storage: ^10.3.1

  # state management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  bloc_concurrency: ^0.3.0

  # injection
  injectable: ^3.0.0
  get_it: ^9.2.1

  # navigation
  auto_route: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  auto_route_generator: ^10.5.0
  build_runner: ^2.13.1
  import_sorter: ^4.6.0
  injectable_generator: ^3.0.2
  flutter_gen_runner: ^5.13.0+1
  retrofit_generator: ^10.2.3
  json_serializable: ^6.13.0
  change_package_name: ^1.1.0

flutter_gen:
  output: lib/presentation/ui_utils/assets
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: "Ufficio"
      fonts:
        - asset: assets/fonts/ufficio_300.ttf
          weight: 300
        - asset: assets/fonts/ufficio_400.ttf
          weight: 400
        - asset: assets/fonts/ufficio_500.ttf
          weight: 500
        - asset: assets/fonts/ufficio_600.ttf
          weight: 600
        - asset: assets/fonts/ufficio_700.ttf
          weight: 700
        - asset: assets/fonts/ufficio_800.ttf
          weight: 800
        - asset: assets/fonts/ufficio_900.ttf
          weight: 900

flutter_intl:
  enabled: true
  main_locale: en
  output_dir: lib/l10n/generated
  arb_dir: lib/l10n
